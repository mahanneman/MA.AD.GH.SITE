name: Send Telegram Messages

on:
  push:
    paths:
      - 'notify/notify.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Debug - show files
        run: |
          ls -la
          ls -la scripts/ || echo "scripts folder not found"
          cat notify/notify.json || echo "notify.json not found"

      - name: Run sender
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_contact_to_telegram.py || echo "Script failed with exit code $?"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notify/notify.json notify/historynotify.json 2>/dev/null || echo "No files to add"
          git commit -m "Move sent messages to history" || echo "No changes"
          git push origin main || echo "Push failed"
