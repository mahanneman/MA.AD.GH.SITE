name: Send Telegram Messages

on:
  push:
    paths:
      - 'notify/notify.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install requests
        run: pip install requests

      - name: 🚀 Run Telegram sender
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_contact_to_telegram.py

      - name: 💾 Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notify/notify.json notify/historynotify.json 2>/dev/null || echo "No files"
          git commit -m "📤 Update notify status" || echo "No changes"
          git push origin main || echo "Push failed"
