name: Notify File Changes to Telegram

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # برای دیدن فایل‌های تغییر یافته

      - name: 🔍 تشخیص فایل‌های تغییر یافته
        id: changed
        run: |
          # لیست فایل‌های اضافه/حذف/تغییر یافته
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          if [ -z "$FILES" ]; then
            FILES="(هیچ فایلی تغییر نکرده)"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: 📨 ارسال پیام به تلگرام
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILES: ${{ steps.changed.outputs.files }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          TEXT="✅ تغییرات اعمال شد!

          📦 ریپازیتوری: ${REPO}
          🌿 شاخه: ${BRANCH}

          📁 فایل‌های تغییر یافته:
          ${FILES}

          📝 پیام کامیت: ${COMMIT_MSG}
          👤 توسط: ${AUTHOR}

          🔗 مشاهده: ${COMMIT_URL}"

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            --data-urlencode text="${TEXT}"
