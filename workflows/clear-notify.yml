name: Clear Notify File

on:
  schedule:
    - cron: '0 */7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear notify.json
        run: |
          echo '[]' > notify/notify.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add notify/notify.json
          git commit -m "🗑️ Auto-clear notify.json (every 7 hours)" || echo "No changes"
          git push || echo "Push failed"
          
