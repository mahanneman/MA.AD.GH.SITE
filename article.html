    <!-- ===== Article Page Specific Styles ===== -->
    <style>
        /* ===== تمام استایل‌های اختصاصی مقاله (بدون تغییر) ===== */
        .article-page {
            max-width: 1000px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }
        .article-page .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .article-page .back-link:hover {
            color: var(--primary-color);
        }
        .article-page .back-link i {
            margin-left: 6px;
        }
        .article-page .article-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 35px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .article-page .cover {
            width: 100%;
            max-height: 450px;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 25px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .article-page .cover img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .article-page .cover .placeholder {
            font-size: 5rem;
            color: var(--text-secondary);
            padding: 80px 0;
            opacity: 0.3;
        }
        .article-page .article-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--text-primary);
        }
        .article-page .article-header .type-badge {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .type-article { background: var(--primary-color); color: #fff; }
        .type-project { background: var(--secondary-color); color: #fff; }
        .type-tutorial { background: #f59e0b; color: #0a0f1a; }
        .article-page .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .article-page .meta i { margin-left: 4px; }
        .article-page .abstract {
            background: var(--bg-tertiary);
            padding: 18px 22px;
            border-radius: 12px;
            border-right: 4px solid var(--primary-color);
            margin-bottom: 25px;
        }
        .article-page .abstract h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }
        .article-page .abstract p {
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text-secondary);
            margin: 0;
        }
        .article-page .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        .article-page .image-gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .article-page .image-gallery img:hover {
            transform: scale(1.03);
        }
        .article-page .body {
            font-size: 1.05rem;
            line-height: 2.1;
            color: var(--text-primary);
            margin: 20px 0;
        }
        .article-page .body img {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
        }
        .article-page .body h2,
        .article-page .body h3 {
            margin-top: 25px;
            margin-bottom: 10px;
        }
        .article-page .download-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }
        .article-page .download-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .article-page .download-section h3 i {
            color: var(--primary-color);
        }
        .article-page .download-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .article-page .download-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .article-page .download-item:hover {
            border-color: var(--primary-color);
            background: var(--bg-secondary);
        }
        .article-page .download-item a {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .article-page .download-item a:hover {
            color: var(--primary-color);
        }
        .article-page .download-item i {
            color: var(--primary-color);
        }
        .article-page .download-item .file-size {
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .article-page .article-footer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .article-page .article-footer .year {
            background: var(--bg-tertiary);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .article-page .article-footer .year i {
            margin-left: 4px;
            color: var(--primary-color);
        }
        .article-page .references {
            flex: 1;
        }
        .article-page .references h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }
        .article-page .references ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .article-page .references ul li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }
        .article-page .references ul li:last-child {
            border-bottom: none;
        }
        .article-page .references ul li i {
            color: var(--primary-color);
            margin-top: 3px;
        }
        .not-found {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .not-found i {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 80px 20px;
        }
        .loading i {
            font-size: 3rem;
            color: var(--primary-color);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .article-page .article-card { padding: 20px; }
            .article-page .article-header h1 { font-size: 1.5rem; }
            .article-page .image-gallery { grid-template-columns: 1fr 1fr; }
            .article-page .image-gallery img { height: 150px; }
            .article-page .download-grid { flex-direction: column; }
            .article-page .download-item { width: 100%; justify-content: center; }
        }

<body>

    <!-- ===== هدر و منوی کشویی توسط menu.js بارگذاری می‌شوند ===== -->
    <!-- هیچ کد هدر و منوی دستی در اینجا وجود ندارد -->

    <!-- ===== محتوای اصلی ===== -->
    <div class="article-page">
        <a href="articles.html" class="back-link"><i class="fas fa-arrow-right"></i> بازگشت به مقالات</a>
        <div id="articleContent">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i><p style="color:var(--text-secondary);">در حال بارگذاری...</p></div>
        </div>
    </div>

    <!-- ===== جایگاه فوتر (بارگذاری توسط اسکریپت) ===== -->

    <!-- ============================================================
         اسکریپت‌ها (ترتیب مهم است)
         ============================================================ -->

    <!-- بارگذاری هدر و منوی کشویی از member-menu.html -->
    <script src="menu.js"></script>

    <!-- ===== اسکریپت بارگذاری مقاله (بدون تغییر) ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('articleContent');

            if (!id) {
                container.innerHTML = `
                    <div class="not-found">
                        <i class="fas fa-exclamation-circle" style="color:#ef4444;"></i>
                        <h2>شناسه مقاله مشخص نشده است.</h2>
                        <a href="articles.html" class="back-link" style="margin-top:20px;display:inline-block;">مشاهده همه مقالات</a>
                    </div>
                `;
                return;
            }

            const typeLabels = { article: 'مقاله', project: 'پروژه', tutorial: 'آموزش' };
            const typeClasses = { article: 'type-article', project: 'type-project', tutorial: 'type-tutorial' };

            async function loadArticle() {
                try {
                    const res = await fetch('_data/articles.json?t=' + Date.now());
                    if (!res.ok) throw new Error('فایل مقالات پیدا نشد');
                    const data = await res.json();
                    const article = data[id];

                    if (!article) {
                        container.innerHTML = `
                            <div class="not-found">
                                <i class="fas fa-search" style="color:#f59e0b;"></i>
                                <h2>مقاله‌ای با این شناسه یافت نشد.</h2>
                                <a href="articles.html" class="back-link" style="margin-top:20px;display:inline-block;">مشاهده همه مقالات</a>
                            </div>
                        `;
                        return;
                    }

                    // بروزرسانی سئو
                    const pageTitle = (article.title || 'مقاله') + ' | مهندس ماهان ادهم قزوینی';
                    document.getElementById('pageTitle').textContent = pageTitle;
                    document.title = pageTitle;
                    document.getElementById('pageDescription').content = article.excerpt || article.abstract || 'مشاهده مقاله تخصصی مهندسی مکانیک';
                    document.getElementById('ogTitle').content = article.title || 'مقاله تخصصی مهندسی مکانیک';
                    document.getElementById('ogDescription').content = article.excerpt || article.abstract || 'مشاهده مقاله تخصصی مهندسی مکانیک';
                    document.getElementById('twitterTitle').content = article.title || 'مقاله تخصصی مهندسی مکانیک';
                    document.getElementById('twitterDesc').content = article.excerpt || article.abstract || 'مشاهده مقاله تخصصی مهندسی مکانیک';
                    if (article.cover) {
                        document.getElementById('ogImage').content = article.cover;
                        document.getElementById('twitterImage').content = article.cover;
                    }

                    const coverImg = article.cover || article.image || '';
                    const coverHtml = coverImg ?
                        `<img src="${coverImg}" alt="${article.title}">` :
                        `<div class="placeholder"><i class="fas fa-newspaper"></i></div>`;

                    const typeLabel = typeLabels[article.type] || 'مقاله';
                    const typeClass = typeClasses[article.type] || 'type-article';

                    let galleryHtml = '';
                    if (article.images && article.images.length > 0) {
                        galleryHtml = `
                            <div class="image-gallery">
                                ${article.images.map(img => `<img src="${img}" alt="عکس مقاله" loading="lazy">`).join('')}
                            </div>
                        `;
                    }

                    let mainFileHtml = '';
                    if (article.file) {
                        mainFileHtml = `
                            <div class="download-item">
                                <i class="fas fa-file-pdf"></i>
                                <a href="assets/articles/${id}/${article.file}" target="_blank">
                                    دانلود فایل مقاله (PDF)
                                    <span class="file-size">(${article.fileSize || '---'})</span>
                                </a>
                            </div>
                        `;
                    }

                    let filesHtml = '';
                    if (article.files && article.files.length > 0) {
                        const fileItems = article.files.map(f => {
                            const fileName = typeof f === 'string' ? f : f.name || f;
                            const fileSize = typeof f === 'object' ? f.size : '';
                            return `
                                <div class="download-item">
                                    <i class="fas fa-paperclip"></i>
                                    <a href="assets/articles/${id}/${fileName}" target="_blank">
                                        ${fileName}
                                        ${fileSize ? `<span class="file-size">(${fileSize})</span>` : ''}
                                    </a>
                                </div>
                            `;
                        }).join('');
                        filesHtml = `
                            <div class="download-section">
                                <h3><i class="fas fa-paperclip"></i> فایل‌های پیوست (${article.files.length})</h3>
                                <div class="download-grid">
                                    ${fileItems}
                                </div>
                            </div>
                        `;
                    }

                    let downloadSectionHtml = '';
                    if (mainFileHtml || filesHtml) {
                        downloadSectionHtml = `
                            <div class="download-section">
                                <h3><i class="fas fa-download"></i> دانلود فایل‌ها</h3>
                                <div class="download-grid">
                                    ${mainFileHtml}
                                    ${article.files && article.files.length > 0 ? article.files.map(f => {
                                        const fileName = typeof f === 'string' ? f : f.name || f;
                                        return `
                                            <div class="download-item">
                                                <i class="fas fa-paperclip"></i>
                                                <a href="assets/articles/${id}/${fileName}" target="_blank">
                                                    ${fileName}
                                                </a>
                                            </div>
                                        `;
                                    }).join('') : ''}
                                </div>
                            </div>
                        `;
                    }

                    let referencesHtml = '';
                    if (article.references && article.references.length > 0) {
                        referencesHtml = `
                            <div class="references">
                                <h4><i class="fas fa-book"></i> منابع</h4>
                                <ul>
                                    ${article.references.map(ref => `<li><i class="fas fa-quote-left"></i> ${ref}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }

                    const yearHtml = article.year ? `
                        <span class="year"><i class="fas fa-calendar-alt"></i> سال انتشار: ${article.year}</span>
                    ` : '';

                    container.innerHTML = `
                        <div class="article-card">
                            <div class="cover">${coverHtml}</div>
                            <div class="article-header">
                                <span class="type-badge ${typeClass}">${typeLabel}</span>
                                <h1>${article.title || 'بدون عنوان'}</h1>
                            </div>
                            <div class="meta">
                                <span><i class="fas fa-calendar"></i> ${article.date || '---'}</span>
                                ${article.readTime ? `<span><i class="fas fa-clock"></i> ${article.readTime} دقیقه مطالعه</span>` : ''}
                                ${article.tags && article.tags.length ? `<span><i class="fas fa-tags"></i> ${article.tags.join('، ')}</span>` : ''}
                            </div>
                            ${article.abstract ? `
                                <div class="abstract">
                                    <h4><i class="fas fa-align-right"></i> چکیده</h4>
                                    <p>${article.abstract}</p>
                                </div>
                            ` : ''}
                            ${galleryHtml}
                            <div class="body">${article.body || article.excerpt || 'توضیحاتی برای این مقاله ثبت نشده است.'}</div>
                            ${downloadSectionHtml}
                            <div class="article-footer">
                                ${yearHtml}
                                ${referencesHtml}
                            </div>
                        </div>
                    `;
                } catch (e) {
                    container.innerHTML = `
                        <div class="not-found">
                            <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                            <h2>خطا در بارگذاری</h2>
                            <p>${e.message}</p>
                        </div>
                    `;
                }
            }

            loadArticle();
        });
    </script>

    <!-- ===== اسکریپت بارگذاری فوتر ===== -->
    <script>
        (function loadFooter() {
            fetch('footer.html')
                .then(res => {
                    if (!res.ok) throw new Error('خطا در بارگذاری فوتر');
                    return res.text();
                })
                .then(html => {
                    document.getElementById('footerContainer').innerHTML = html;
                    // به‌روزرسانی سال در فوتر
                    const yearEl = document.querySelector('#footerContainer .copyright p:first-child');
                    if (yearEl) {
                        const persianYear = new Date().getFullYear() - 621;
                        yearEl.innerHTML = yearEl.innerHTML.replace('۱۴۰۳', persianYear);
                    }
                })
                .catch(err => console.error('خطا در بارگذاری فوتر:', err));
        })();
    </script>

</body>
