name: Sync All Users & Orders to Sender

on:
  push:
    paths:
      - 'member/member*/info.json'
      - 'member/member*/orders.json'
    branches:
      - main
  workflow_dispatch:   # برای اجرای دستی در صورت نیاز

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 Run sync script
        run: python scripts/sync_to_sender.py   # ← مسیر جدید

      - name: 💾 Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/ids.json member/orders/pendingorder-sender.json member/orders/pendingorder.json
          git commit -m "🔄 Auto-sync users & orders to sender" || echo "No changes"
          git pull --rebase origin main || echo "Pull failed"
          git push origin main || echo "Push failed"
