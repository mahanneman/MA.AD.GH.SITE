<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           استایل‌های اختصاصی صفحه ورود
           ============================================================ */
        :root {
            --login-primary: #2563eb;
            --login-danger: #ef4444;
            --login-success: #22c55e;
            --login-bg: #0a0f1a;
            --login-card: #141b2b;
            --login-border: #1e2a3d;
            --login-text: #f1f5f9;
            --login-text-sec: #94a3b8;
            --login-radius: 16px;
            --login-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--login-bg);
            color: var(--login-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        .login-container { width: 100%; max-width: 420px; animation: fadeUp 0.5s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-card {
            background: var(--login-card);
            border-radius: var(--login-radius);
            padding: 40px 32px;
            border: 1px solid var(--login-border);
            box-shadow: var(--login-shadow);
            transition: 0.3s;
        }
        .login-card:hover { border-color: rgba(37,99,235,0.3); }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo i { font-size: 3rem; background: linear-gradient(135deg, var(--login-primary), #8b5cf6); padding: 18px; border-radius: 50%; color: #fff; }
        .logo h1 { font-size: 1.5rem; margin-top: 14px; font-weight: 800; }
        .logo p { color: var(--login-text-sec); font-size: 0.9rem; }
        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: var(--login-text-sec); }
        .form-group label i { margin-left: 6px; color: var(--login-primary); }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--login-bg);
            border: 2px solid var(--login-border);
            border-radius: 12px;
            transition: 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: var(--login-primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--login-text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            outline: none;
            direction: ltr;
            text-align: right;
        }
        .input-wrapper input::placeholder { color: var(--login-text-sec); opacity: 0.6; }
        .toggle-pass {
            padding: 0 14px;
            cursor: pointer;
            color: var(--login-text-sec);
            background: transparent;
            border: none;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .toggle-pass:hover { color: var(--login-text); }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--login-primary);
            color: #fff;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37,99,235,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 0.8rem; flex-wrap: wrap; gap: 6px; }
        .links a { color: var(--login-text-sec); text-decoration: none; transition: 0.3s; cursor: pointer; }
        .links a:hover { color: var(--login-primary); }
        .error-msg {
            color: var(--login-danger);
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(239,68,68,0.08);
            padding: 8px 12px;
            border-radius: 8px;
            border-right: 3px solid var(--login-danger);
        }
        .error-msg.show { display: flex; }
        .success-msg {
            color: var(--login-success);
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(34,197,94,0.08);
            padding: 8px 12px;
            border-radius: 8px;
            border-right: 3px solid var(--login-success);
        }
        .success-msg.show { display: flex; }
        .security-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--login-bg);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            border: 1px solid var(--login-border);
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .security-badge i { font-size: 0.9rem; }

        /* ===== CAPTCHA استایل ===== */
        .captcha-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--login-bg);
            border: 2px solid var(--login-border);
            border-radius: 12px;
            padding: 8px 14px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .captcha-wrapper .question {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--login-primary);
            flex: 1;
            min-width: 100px;
        }
        .captcha-wrapper .refresh-btn {
            background: transparent;
            border: none;
            color: var(--login-text-sec);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: 0.3s;
        }
        .captcha-wrapper .refresh-btn:hover {
            color: var(--login-primary);
            transform: rotate(60deg);
        }
        .captcha-wrapper input {
            width: 80px;
            padding: 8px 10px;
            background: var(--login-bg);
            border: 2px solid var(--login-border);
            border-radius: 8px;
            color: var(--login-text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        .captcha-wrapper input:focus {
            border-color: var(--login-primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .captcha-hint {
            font-size: 0.7rem;
            color: var(--login-text-sec);
            opacity: 0.7;
            margin-right: 4px;
        }
        .rate-limit-info {
            font-size: 0.7rem;
            color: var(--login-text-sec);
            opacity: 0.6;
            margin-top: 4px;
            text-align: left;
        }
        .rate-limit-info .remaining {
            color: var(--login-warning, #f59e0b);
            font-weight: 600;
        }

        @media (max-width: 480px) { 
            .login-card { padding: 28px 18px; } 
            .logo i { font-size: 2.4rem; padding: 14px; }
            .captcha-wrapper { flex-direction: column; align-items: stretch; }
            .captcha-wrapper .question { text-align: center; }
            .captcha-wrapper input { width: 100%; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <!-- لوگو -->
        <div class="logo">
            <i class="fas fa-user-circle"></i>
            <h1>ورود به حساب</h1>
            <p>پنل کاربری ماهان ادهم قزوینی</p>
        </div>

        <!-- فرم ورود -->
        <form id="loginForm" autocomplete="off">
            <!-- ===== فیلد مخفی CSRF Token ===== -->
            <input type="hidden" name="csrf_token" id="csrfToken" value="">

            <div class="form-group">
                <label><i class="fas fa-user"></i> نام کاربری یا ایمیل</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="نام کاربری یا ایمیل خود را وارد کنید" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> رمز عبور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
                    <button type="button" class="toggle-pass" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- ===== CAPTCHA ===== -->
            <div class="form-group">
                <label><i class="fas fa-shield-alt"></i> کد امنیتی</label>
                <div class="captcha-wrapper" id="captchaWrapper">
                    <span class="question" id="captchaQuestion">۰ + ۰ = ؟</span>
                    <button type="button" class="refresh-btn" onclick="refreshCaptcha()" title="تولید مجدد">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <input type="text" id="captchaInput" placeholder="عدد" maxlength="2" inputmode="numeric" required>
                </div>
                <div class="captcha-hint">جمع دو عدد را وارد کنید</div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> ورود
            </button>

            <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i> <span id="errorText"></span></div>
            <div class="success-msg" id="successMsg"><i class="fas fa-check-circle"></i> <span id="successText"></span></div>

            <!-- ===== Rate Limit Info ===== -->
            <div class="rate-limit-info" id="rateLimitInfo">
                <i class="fas fa-info-circle"></i> 
                تعداد تلاش باقی‌مانده: <span class="remaining" id="remainingAttempts">۵</span>
            </div>

            <div class="links">
                <a href="signup.html"><i class="fas fa-user-plus"></i> ثبت‌نام</a>
                <a href="#" id="forgotLink">فراموشی رمز؟</a>
            </div>

            <div class="security-badge">
                <i class="fas fa-shield-alt" style="color:var(--login-success);"></i>
                <span>اتصال امن</span>
                <span style="margin-right:auto;font-size:0.6rem;opacity:0.6;">ورود قبلی: <span id="lastLoginDisplay">---</span></span>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    'use strict';

    // ===== تنظیمات گیت‌هاب =====
    const REPO_OWNER = 'mahanneman';
    const REPO_NAME = 'MA.AD.GH.SITE';
    const REPO_PATH = `repos/${REPO_OWNER}/${REPO_NAME}/contents`;

    // ===== تنظیمات امنیتی =====
    const MAX_LOGIN_ATTEMPTS = 5;
    const LOCKOUT_DURATION = 60; // ثانیه

    // ===== توکن گیت‌هاب =====
    function getToken() {
        return localStorage.getItem('github_token') || '';
    }

    // ===== خواندن فایل از گیت‌هاب =====
    async function fetchFromGitHub(path) {
        const token = getToken();
        if (!token) return null;
        const url = `https://api.github.com/${REPO_PATH}/${path}`;
        const res = await fetch(url, {
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.status === 404) return null;
        if (!res.ok) return null;
        const data = await res.json();
        const binaryString = atob(data.content);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) { bytes[i] = binaryString.charCodeAt(i); }
        const decoder = new TextDecoder('utf-8');
        const content = decoder.decode(bytes).replace(/^\uFEFF/, '');
        return { ...data, content };
    }

    // ===== همگام‌سازی کاربران از گیت‌هاب =====
    async function syncUsersFromGitHub() {
        const token = getToken();
        if (!token) {
            console.warn('⚠️ توکن گیت‌هاب موجود نیست، فقط از localStorage استفاده می‌شود.');
            return;
        }

        try {
            const dirUrl = `https://api.github.com/${REPO_PATH}/member/`;
            const res = await fetch(dirUrl, {
                headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!res.ok) return;
            const items = await res.json();
            const memberDirs = items.filter(item => 
                item.type === 'dir' && item.name.startsWith('member') && /^member\d{4}$/.test(item.name)
            );

            let users = JSON.parse(localStorage.getItem('users_db') || '{}');

            for (const dir of memberDirs) {
                const memberId = dir.name.replace('member', '');
                const infoPath = `member/${dir.name}/info.json`;
                const infoData = await fetchFromGitHub(infoPath);
                if (infoData) {
                    const user = JSON.parse(infoData.content);
                    users[user.id] = user;
                    if (user.username) users[user.username] = user;
                }
            }

            localStorage.setItem('users_db', JSON.stringify(users));
            console.log('✅ کاربران گیت‌هاب با localStorage همگام شدند.');
            return true;
        } catch (e) {
            console.warn('⚠️ خطا در همگام‌سازی کاربران:', e);
            return false;
        }
    }

    // ===== CSRF Token =====
    function generateCSRFToken() {
        const token = crypto.randomUUID();
        const expiry = Date.now() + 3600000; // 1 ساعت
        sessionStorage.setItem('csrf_token', token);
        sessionStorage.setItem('csrf_expiry', expiry);
        return token;
    }

    function getCSRFToken() {
        let token = sessionStorage.getItem('csrf_token');
        const expiry = parseInt(sessionStorage.getItem('csrf_expiry') || '0');
        if (!token || Date.now() > expiry) {
            token = generateCSRFToken();
        }
        return token;
    }

    function validateCSRFToken(token) {
        const stored = sessionStorage.getItem('csrf_token');
        const expiry = parseInt(sessionStorage.getItem('csrf_expiry') || '0');
        if (!stored || stored !== token) {
            throw new Error('توکن CSRF نامعتبر است.');
        }
        if (Date.now() > expiry) {
            throw new Error('توکن CSRF منقضی شده است.');
        }
        return true;
    }

    // ===== سانیتایز =====
    function sanitizeHTML(str) {
        if (!str) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;',
            '/': '&#x2F;',
            '`': '&#x60;',
            '=': '&#x3D;'
        };
        return String(str).replace(/[&<>"'`=\/]/g, function(s) {
            return map[s];
        });
    }

    // ===== CAPTCHA =====
    let captchaAnswer = '';

    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 9) + 1;
        const num2 = Math.floor(Math.random() * 9) + 1;
        const result = num1 + num2;
        captchaAnswer = String(result);

        const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
        const toPersian = (num) => String(num).split('').map(d => persianDigits[parseInt(d)] || d).join('');

        document.getElementById('captchaQuestion').textContent = `${toPersian(num1)} + ${toPersian(num2)} = ؟`;
        document.getElementById('captchaInput').value = '';
        document.getElementById('captchaInput').focus();
        
        sessionStorage.setItem('captcha_answer', captchaAnswer);
        sessionStorage.setItem('captcha_expiry', Date.now() + 300000); // ۵ دقیقه
    }

    function validateCaptcha(input) {
        const storedAnswer = sessionStorage.getItem('captcha_answer');
        const expiry = parseInt(sessionStorage.getItem('captcha_expiry') || '0');
        if (!storedAnswer) return false;
        if (Date.now() > expiry) {
            sessionStorage.removeItem('captcha_answer');
            return false;
        }
        const isValid = input.trim() === storedAnswer;
        if (isValid) {
            sessionStorage.removeItem('captcha_answer');
        }
        return isValid;
    }

    window.refreshCaptcha = generateCaptcha;

    // ===== Rate Limiting =====
    function getRateLimitData(identifier) {
        const key = `rate_${identifier}`;
        const data = JSON.parse(localStorage.getItem(key) || '{"count":0,"lockUntil":null}');
        return data;
    }

    function saveRateLimitData(identifier, data) {
        const key = `rate_${identifier}`;
        localStorage.setItem(key, JSON.stringify(data));
    }

    function checkRateLimit(identifier) {
        const data = getRateLimitData(identifier);
        if (data.lockUntil && Date.now() < data.lockUntil) {
            const remaining = Math.ceil((data.lockUntil - Date.now()) / 1000);
            throw new Error(`❌ حساب قفل است. ${remaining} ثانیه دیگر تلاش کنید.`);
        }
        if (data.lockUntil && Date.now() >= data.lockUntil) {
            data.count = 0;
            data.lockUntil = null;
            saveRateLimitData(identifier, data);
        }
        return data;
    }

    function recordFailedAttempt(identifier) {
        const data = getRateLimitData(identifier);
        data.count += 1;
        if (data.count >= MAX_LOGIN_ATTEMPTS) {
            data.lockUntil = Date.now() + LOCKOUT_DURATION * 1000;
        }
        saveRateLimitData(identifier, data);
        updateRateLimitDisplay(identifier);
        return data;
    }

    function resetRateLimit(identifier) {
        const key = `rate_${identifier}`;
        localStorage.removeItem(key);
        updateRateLimitDisplay(identifier);
    }

    function updateRateLimitDisplay(identifier) {
        const data = getRateLimitData(identifier);
        const remaining = Math.max(0, MAX_LOGIN_ATTEMPTS - data.count);
        document.getElementById('remainingAttempts').textContent = remaining;
        if (data.lockUntil && Date.now() < data.lockUntil) {
            const rem = Math.ceil((data.lockUntil - Date.now()) / 1000);
            document.getElementById('remainingAttempts').textContent = `⏳ ${rem}s`;
        }
    }

    // ===== عناصر DOM =====
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const captchaInput = document.getElementById('captchaInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const successMsg = document.getElementById('successMsg');
    const successText = document.getElementById('successText');
    const lastLoginDisplay = document.getElementById('lastLoginDisplay');
    const csrfInput = document.getElementById('csrfToken');

    // ===== توابع مدیریت کاربران =====
    function getUsers() {
        const data = localStorage.getItem('users_db');
        if (data) { try { return JSON.parse(data); } catch (e) { return {}; } }
        return {};
    }

    function saveUsers(users) {
        localStorage.setItem('users_db', JSON.stringify(users));
    }

    function getLastLogin(username) {
        const users = getUsers();
        if (users[username] && users[username].lastLogin) {
            return new Date(users[username].lastLogin).toLocaleString('fa-IR');
        }
        return '---';
    }

    // ===== نمایش/مخفی‌سازی رمز =====
    window.togglePasswordVisibility = function() {
        const eye = document.getElementById('eyeIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eye.className = 'fas fa-eye-slash';
        } else {
            passwordInput.type = 'password';
            eye.className = 'fas fa-eye';
        }
    };

    // ===== نمایش پیام =====
    function showError(msg) {
        errorText.textContent = msg;
        errorMsg.classList.add('show');
        successMsg.classList.remove('show');
    }

    function showSuccess(msg) {
        successText.textContent = msg;
        successMsg.classList.add('show');
        errorMsg.classList.remove('show');
    }

    function clearMessages() {
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');
    }

    // ===== نمایش آخرین ورود =====
    const lastUser = sessionStorage.getItem('last_username');
    if (lastUser) {
        lastLoginDisplay.textContent = getLastLogin(lastUser);
    }

    // ===== تنظیم CSRF Token =====
    csrfInput.value = getCSRFToken();

    // ===== تنظیم CAPTCHA =====
    generateCaptcha();

    // ===== نمایش Rate Limit =====
    const storedUsername = localStorage.getItem('last_login_attempt');
    if (storedUsername) {
        updateRateLimitDisplay(storedUsername);
    } else {
        document.getElementById('remainingAttempts').textContent = MAX_LOGIN_ATTEMPTS;
    }

    // ===== رویداد ارسال فرم =====
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearMessages();

        // ۱. اعتبارسنجی CSRF
        const csrfToken = csrfInput.value;
        try {
            validateCSRFToken(csrfToken);
        } catch (err) {
            showError('❌ ' + err.message + ' لطفاً صفحه را مجدداً بارگذاری کنید.');
            csrfInput.value = generateCSRFToken();
            return;
        }

        // ۲. دریافت و سانیتایز ورودی‌ها
        const username = sanitizeHTML(usernameInput.value.trim());
        const password = passwordInput.value.trim();
        const captcha = sanitizeHTML(captchaInput.value.trim());

        // ۳. اعتبارسنجی ورودی‌ها
        if (!username || !password) {
            showError('لطفاً همه فیلدها را پر کنید.');
            return;
        }

        // ۴. اعتبارسنجی CAPTCHA
        if (!validateCaptcha(captcha)) {
            showError('❌ کد امنیتی اشتباه است.');
            generateCaptcha();
            return;
        }

        // ۵. بررسی Rate Limit
        const identifier = username.toLowerCase();
        localStorage.setItem('last_login_attempt', identifier);
        try {
            checkRateLimit(identifier);
        } catch (err) {
            showError(err.message);
            updateRateLimitDisplay(identifier);
            return;
        }

        // ۶. همگام‌سازی کاربران از گیت‌هاب
        await syncUsersFromGitHub();

        // ۷. جستجوی کاربر
        const users = getUsers();
        let user = null;
        let foundKey = null;
        for (const [key, data] of Object.entries(users)) {
            if (data.username === username || data.email === username) {
                user = data;
                foundKey = key;
                break;
            }
        }

        if (!user) {
            recordFailedAttempt(identifier);
            showError('نام کاربری یا رمز عبور اشتباه است.');
            updateRateLimitDisplay(identifier);
            return;
        }

        // ۸. بررسی رمز عبور
        if (user.password !== password) {
            recordFailedAttempt(identifier);
            showError('نام کاربری یا رمز عبور اشتباه است.');
            updateRateLimitDisplay(identifier);
            return;
        }

        // ۹. ورود موفق
        resetRateLimit(identifier);
        users[foundKey].lastLogin = new Date().toISOString();
        saveUsers(users);

        sessionStorage.setItem('current_user_id', user.id);
        sessionStorage.setItem('current_username', user.username);
        sessionStorage.setItem('last_username', user.username);

        showSuccess('✅ ورود موفق! در حال انتقال به صفحه کاربری...');

        // تولید CSRF جدید
        csrfInput.value = generateCSRFToken();

        setTimeout(() => {
            window.location.href = `memberpage.html?id=${user.id}`;
        }, 800);
    });

    // ===== فراموشی رمز =====
    document.getElementById('forgotLink').addEventListener('click', function(e) {
        e.preventDefault();
        const username = prompt('نام کاربری خود را وارد کنید تا رمز عبور نمایش داده شود:');
        if (username) {
            const users = getUsers();
            let found = null;
            for (const [key, data] of Object.entries(users)) {
                if (data.username === username) {
                    found = data;
                    break;
                }
            }
            if (found) {
                alert(`رمز عبور شما: ${found.password}\n(لطفاً پس از ورود، رمز خود را تغییر دهید)`);
            } else {
                alert('کاربری با این نام پیدا نشد.');
            }
        }
    });

    // ===== بررسی نشست قبلی =====
    const currentSession = sessionStorage.getItem('current_user_id');
    if (currentSession) {
        const users = getUsers();
        let exists = false;
        for (const [key, data] of Object.entries(users)) {
            if (data.id === currentSession) {
                exists = true;
                break;
            }
        }
        if (exists) {
            window.location.href = `memberpage.html?id=${currentSession}`;
        } else {
            sessionStorage.removeItem('current_user_id');
            sessionStorage.removeItem('current_username');
        }
    }

    // ===== به‌روزرسانی Rate Limit با هر بار تایپ =====
    usernameInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (val.length > 2) {
            updateRateLimitDisplay(val.toLowerCase());
        }
    });

    console.log('✅ صفحه ورود با امنیت CSRF، CAPTCHA و Rate Limit بارگذاری شد.');
})();
</script>
